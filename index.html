<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AttendEase | Live Supabase College Attendance Management</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                            800: '#1e40af',
                            900: '#1e3a8a',
                        }
                    }
                }
            }
        }
    </script>
    <!-- React 18, ReactDOM, Babel Standalone -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- SheetJS (xlsx) & Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Supabase Configuration File -->
    <script src="supabaseConfig.js"></script>
    <!-- Inter Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass-header {
            background: rgba(20, 40, 75, 0.95);
            backdrop-filter: blur(8px);
        }
        @media print {
            .no-print { display: none !important; }
            .print-only { display: block !important; }
        }
        .print-only { display: none; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        const sanitizeInput = (val) => {
            if (!val) return '';
            let clean = String(val).trim();

            // 1. Direct Supabase project URL match: e.g. https://xxx.supabase.co
            const urlMatch = clean.match(/https?:\/\/[a-zA-Z0-9.-]+\.supabase\.co[^\s"'`;]*/i);
            if (urlMatch) {
                return urlMatch[0].replace(/\/+$/, '');
            }

            // 2. Raw Supabase domain match: e.g. xxx.supabase.co
            const domainMatch = clean.match(/([a-zA-Z0-9_-]+\.supabase\.co)/i);
            if (domainMatch) {
                return 'https://' + domainMatch[1];
            }

            // 3. Supabase API Key match (both classic eyJ... JWT and new sb_publishable_... keys)
            const keyMatch = clean.match(/(sb_publishable_[a-zA-Z0-9_-]+|eyJ[a-zA-Z0-9._-]+)/i);
            if (keyMatch) {
                return keyMatch[1];
            }

            // 4. Strip variable prefixes: const x =, let x =, var x =, window.x =, VITE_x =
            clean = clean.replace(/^(?:export\s+)?(?:const|let|var|window\.)?[a-zA-Z0-9_$]+\s*=\s*/i, '');

            // 5. Remove comments, quotes, semicolons, extra whitespace
            clean = clean.replace(/\/\*[\s\S]*?\*\//g, '');
            clean = clean.replace(/\s+\/\/.*$/gm, '');
            clean = clean.replace(/#.*$/gm, '');
            clean = clean.trim().replace(/^["'`]|["'`];?$/g, '').trim().replace(/;+$/g, '').trim();

            return clean;
        };

        const CONFIGURED_URL = (typeof window !== 'undefined' && window.SUPABASE_URL)
            ? window.SUPABASE_URL
            : "https://uzdkiwvzluznucjcynqg.supabase.co";

        const CONFIGURED_KEY = (typeof window !== 'undefined' && window.SUPABASE_ANON_KEY)
            ? window.SUPABASE_ANON_KEY
            : "sb_publishable_RBKD0CnOT2A1_YWS1hJokg_IFcCaETV";

        const DAYS = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];

        const emptyDatabase = {
            classes: [],
            subjects: [],
            students: [],
            teachers: [],
            teacherAssignments: [],
            timetable: [],
            overrides: [],
            sessions: [],
            attendance: []
        };

        // ---------------------------------------------------------
        // MAIN APP COMPONENT
        // ---------------------------------------------------------
        function App() {
            const [db, setDb] = useState(emptyDatabase);
            const [isLoading, setIsLoading] = useState(false);

            // Cleanly retrieve URL and Key without old demo or truncated values
            const [supabaseUrl, setSupabaseUrl] = useState(() => {
                const stored = localStorage.getItem('supabase_url');
                if (stored && stored.trim() && stored.trim() !== 'https:' && stored.trim() !== 'http:' && !stored.includes('your-project') && !stored.includes('demo') && stored.includes('.supabase.co')) {
                    return sanitizeInput(stored);
                }
                return sanitizeInput(CONFIGURED_URL);
            });

            const [supabaseKey, setSupabaseKey] = useState(() => {
                const stored = localStorage.getItem('supabase_key');
                if (stored && stored.trim() && !stored.includes('your-project') && !stored.includes('demo') && !stored.includes('eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...')) {
                    return sanitizeInput(stored);
                }
                return sanitizeInput(CONFIGURED_KEY);
            });

            const [supabaseClient, setSupabaseClient] = useState(null);
            const [clientError, setClientError] = useState(null);
            const [currentUser, setCurrentUser] = useState(null);
            const [activeTab, setActiveTab] = useState('attendance');
            const [isConfigOpen, setIsConfigOpen] = useState(false);
            const [toast, setToast] = useState(null);

            const showToast = (message, type = 'info') => {
                setToast({ message, type });
                setTimeout(() => setToast(null), 3500);
            };

            // Clear corrupted legacy localStorage entries automatically
            useEffect(() => {
                const storedU = localStorage.getItem('supabase_url');
                if (storedU && (!storedU.includes('.supabase.co') || storedU === 'https:' || storedU === 'http:')) {
                    localStorage.removeItem('supabase_url');
                }
            }, []);

            // Initialize Supabase Client
            useEffect(() => {
                const url = sanitizeInput(supabaseUrl);
                const key = sanitizeInput(supabaseKey);
                if (!window.supabase) {
                    setClientError('Supabase JS library not loaded. Check internet connection.');
                    setSupabaseClient(null);
                    return;
                }
                if (!url || !key) {
                    setClientError('Supabase URL or Key is missing.');
                    setSupabaseClient(null);
                    return;
                }

                try {
                    const client = window.supabase.createClient(url, key);
                    setSupabaseClient(client);
                    setClientError(null);

                    client.auth.getSession().then(({ data, error: sessionError }) => {
                        if (sessionError) {
                            console.warn('Session check warning:', sessionError);
                            setClientError(sessionError.message);
                        } else if (data && data.session && data.session.user) {
                            verifyAndSetUser(client, data.session.user);
                        }
                    }).catch(e => {
                        console.warn('getSession catch:', e);
                        setClientError(e.message);
                    });

                    const { data: authListener } = client.auth.onAuthStateChange(async (event, session) => {
                        if (session && session.user) {
                            await verifyAndSetUser(client, session.user);
                        } else {
                            setCurrentUser(null);
                            setDb(emptyDatabase);
                        }
                    });

                    return () => {
                        if (authListener && authListener.subscription) {
                            authListener.subscription.unsubscribe();
                        }
                    };
                } catch (err) {
                    console.error('Supabase init error:', err);
                    setSupabaseClient(null);
                    setClientError(err.message || 'Invalid URL or Key format');
                }
            }, [supabaseUrl, supabaseKey]);

            // Verify user role & linked records
            const verifyAndSetUser = async (client, authUser) => {
                try {
                    // 1. Check if user is in app_admins or email contains admin or is admin email
                    const { data: adminData } = await client
                        .from('app_admins')
                        .select('user_id')
                        .eq('user_id', authUser.id)
                        .maybeSingle();

                    // 2. Check if student in students table
                    let studentRecord = null;
                    const authEmail = authUser.email ? authUser.email.toLowerCase() : '';
                    const emailPrefix = authEmail.includes('@') ? authEmail.split('@')[0] : authEmail;

                    try {
                        const { data: sData } = await client
                            .from('students')
                            .select('*')
                            .or(`email.ilike.${authEmail},roll_no.ilike.${emailPrefix}`)
                            .maybeSingle();
                        if (sData) studentRecord = sData;
                    } catch (e) {
                        console.warn('Student check note:', e);
                    }

                    // 3. Check if teacher in teachers table
                    let teacherRecord = null;
                    try {
                        const { data: tData } = await client
                            .from('teachers')
                            .select('*')
                            .or(`user_id.eq.${authUser.id},email.ilike.${authEmail}`)
                            .maybeSingle();
                        if (tData) teacherRecord = tData;
                    } catch (e) {
                        console.warn('Teacher check note:', e);
                    }

                    const isAdmin = !!adminData || 
                                    authEmail.includes('admin') || 
                                    authEmail === 'akverma4466@gmail.com';
                    if (isAdmin && !adminData) {
                        try {
                            client.from('app_admins').upsert({ user_id: authUser.id, role: 'admin' }, { onConflict: 'user_id' }).then(() => {});
                        } catch (_) {}
                    }

                    // Student detection: student profile matched, student role metadata, or roll-number email pattern (e.g. 2400320100140@...)
                    const isStudent = !isAdmin && (
                        !!studentRecord || 
                        authUser.user_metadata?.role === 'student' ||
                        /^\d+@/i.test(authEmail)
                    );

                    let role = 'teacher';
                    if (isAdmin) role = 'admin';
                    else if (isStudent) role = 'student';

                    const finalUser = {
                        id: authUser.id,
                        email: authUser.email,
                        role: role,
                        name: studentRecord?.name || teacherRecord?.name || authUser.user_metadata?.full_name || authEmail.split('@')[0],
                        studentProfile: studentRecord,
                        teacherProfile: teacherRecord
                    };
                    setCurrentUser(finalUser);

                    // Set default tab based on role
                    if (role === 'student') {
                        setActiveTab('student_attendance');
                    } else if (role === 'admin') {
                        setActiveTab('setup');
                    } else {
                        setActiveTab('attendance');
                    }
                } catch (e) {
                    console.error('verifyAndSetUser error:', e);
                    const authEmail = authUser.email ? authUser.email.toLowerCase() : '';
                    const isAdmin = authEmail.includes('admin') || authEmail === 'akverma4466@gmail.com';
                    const isStudent = !isAdmin && (/^\d+@/i.test(authEmail) || authUser.user_metadata?.role === 'student');
                    setCurrentUser({
                        id: authUser.id,
                        email: authUser.email,
                        role: isAdmin ? 'admin' : (isStudent ? 'student' : (authUser.user_metadata?.role || 'teacher')),
                        name: authUser.user_metadata?.full_name || authEmail.split('@')[0]
                    });
                    if (isStudent) {
                        setActiveTab('student_attendance');
                    }
                }
            };

            // Fetch live data from Supabase tables
            const fetchAllData = async () => {
                if (!supabaseClient || !currentUser) return;
                setIsLoading(true);
                try {
                    const [
                        classesRes,
                        subjectsRes,
                        studentsRes,
                        timetableRes,
                        overridesRes,
                        sessionsRes,
                        attendanceRes,
                        assignmentsRes
                    ] = await Promise.all([
                        supabaseClient.from('classes').select('*').order('name'),
                        supabaseClient.from('subjects').select('*').order('name'),
                        supabaseClient.from('students').select('*').order('roll_no'),
                        supabaseClient.from('timetable').select('*').order('day_of_week').order('period_number'),
                        supabaseClient.from('timetable_overrides').select('*').order('timetable_date'),
                        supabaseClient.from('attendance_sessions').select('*'),
                        supabaseClient.from('attendance').select('*'),
                        supabaseClient.from('teacher_assignments').select('*')
                    ]);

                    if (classesRes.error) console.warn('Supabase classes note:', classesRes.error.message);
                    if (subjectsRes.error) console.warn('Supabase subjects note:', subjectsRes.error.message);
                    if (studentsRes.error) console.warn('Supabase students note:', studentsRes.error.message);
                    if (timetableRes.error) console.warn('Supabase timetable note:', timetableRes.error.message);
                    if (overridesRes.error) console.warn('Supabase overrides note:', overridesRes.error.message);
                    if (sessionsRes.error) console.warn('Supabase sessions note:', sessionsRes.error.message);
                    if (attendanceRes.error) console.warn('Supabase attendance note:', attendanceRes.error.message);
                    if (assignmentsRes.error) console.warn('Supabase assignments note:', assignmentsRes.error.message);

                    let teachersData = [];
                    try {
                        const { data: tData, error: tErr } = await supabaseClient.from('teachers').select('*').order('name');
                        if (tErr) console.warn('Supabase teachers note:', tErr.message);
                        if (tData) teachersData = tData;
                    } catch (e) {
                        console.warn('teachers query note:', e);
                    }

                    setDb({
                        classes: (classesRes.data || []).map(c => ({ id: c.id, name: c.name, department: c.department || 'General' })),
                        subjects: (subjectsRes.data || []).map(s => ({ id: s.id, classId: s.class_id, name: s.name, code: s.code || '' })),
                        students: (studentsRes.data || []).map(st => ({
                            id: st.id,
                            classId: st.class_id,
                            rollNo: st.roll_no,
                            name: st.name,
                            email: st.email || '',
                            authUserId: st.auth_user_id || null
                        })),
                        teachers: teachersData.map(t => ({
                            id: t.id,
                            userId: t.user_id,
                            name: t.name,
                            email: t.email,
                            department: t.department || 'General'
                        })),
                        timetable: (timetableRes.data || []).map(t => ({
                            id: t.id,
                            day: t.day_of_week,
                            period: t.period_number,
                            classId: t.class_id,
                            subjectId: t.subject_id,
                            teacher: t.teacher_id || 'Teacher',
                            startTime: t.start_time ? String(t.start_time).slice(0, 5) : '',
                            endTime: t.end_time ? String(t.end_time).slice(0, 5) : '',
                            room: t.room || ''
                        })),
                        overrides: (overridesRes.data || []).map(o => ({
                            id: o.id,
                            date: o.timetable_date,
                            classId: o.class_id,
                            period: o.period_number,
                            replacementSubjectId: o.subject_id,
                            startTime: o.start_time ? String(o.start_time).slice(0, 5) : '',
                            endTime: o.end_time ? String(o.end_time).slice(0, 5) : '',
                            room: o.room || '',
                            isCancelled: o.is_cancelled
                        })),
                        sessions: (sessionsRes.data || []).map(s => ({
                            id: s.id,
                            date: s.session_date,
                            classId: s.class_id,
                            period: s.period_number,
                            status: s.status
                        })),
                        attendance: (attendanceRes.data || []).map(a => ({
                            id: a.id,
                            date: a.attendance_date,
                            classId: a.class_id,
                            period: a.period_number,
                            subjectId: a.subject_id,
                            studentId: a.student_id,
                            status: a.status
                        })),
                        teacherAssignments: (assignmentsRes.data || []).map(ta => ({
                            id: ta.id,
                            teacherId: ta.teacher_id,
                            classId: ta.class_id,
                            subjectId: ta.subject_id
                        }))
                    });
                } catch (error) {
                    console.error('Error fetching live data:', error);
                    showToast('Failed to load database: ' + error.message, 'error');
                } finally {
                    setIsLoading(false);
                }
            };

            useEffect(() => {
                if (currentUser && supabaseClient) {
                    fetchAllData();
                }
            }, [currentUser, supabaseClient]);

            // Authentication Handlers (Unified Login: College Email or Student Roll Number)
            const handleLogin = async (identifier, password) => {
                if (!supabaseClient) {
                    showToast('Supabase is not connected. Please check configuration.', 'error');
                    return;
                }

                setIsLoading(true);
                try {
                    const rawInput = String(identifier).trim();
                    let loginEmail = rawInput;

                    // If user entered roll number (no @ symbol), look up student email
                    if (!rawInput.includes('@')) {
                        try {
                            const { data: studentMatch } = await supabaseClient
                                .from('students')
                                .select('email')
                                .ilike('roll_no', rawInput)
                                .maybeSingle();

                            if (studentMatch && studentMatch.email) {
                                loginEmail = studentMatch.email;
                            } else {
                                loginEmail = `${rawInput.toLowerCase()}@college.edu`;
                            }
                        } catch (_) {
                            loginEmail = `${rawInput.toLowerCase()}@college.edu`;
                        }
                    }

                    // Attempt sign in with resolved email
                    let authRes = await supabaseClient.auth.signInWithPassword({
                        email: loginEmail,
                        password: password
                    });

                    // If failed and user entered a roll number, fallback to trying roll@college.edu if different
                    if (authRes.error && !rawInput.includes('@') && loginEmail !== `${rawInput.toLowerCase()}@college.edu`) {
                        const fallbackEmail = `${rawInput.toLowerCase()}@college.edu`;
                        const retryRes = await supabaseClient.auth.signInWithPassword({
                            email: fallbackEmail,
                            password: password
                        });
                        if (!retryRes.error) {
                            authRes = retryRes;
                        }
                    }

                    if (authRes.error) {
                        const msg = authRes.error.message || '';
                        if (msg.toLowerCase().includes('email not confirmed')) {
                            throw new Error("Student email is not confirmed in Supabase. Please ask Admin to run the auto-confirm SQL snippet or disable 'Confirm email' in Supabase Auth Settings.");
                        }
                        throw authRes.error;
                    }

                    showToast('Signed in successfully!', 'success');
                } catch (err) {
                    showToast(err.message || 'Login failed. Please verify credentials.', 'error');
                } finally {
                    setIsLoading(false);
                }
            };

            const handleLogout = async () => {
                if (supabaseClient) {
                    await supabaseClient.auth.signOut();
                }
                setCurrentUser(null);
                setDb(emptyDatabase);
                showToast('Logged out', 'info');
            };

            // If not logged in, show Auth Screen
            if (!currentUser) {
                return (
                    <React.Fragment>
                        <AuthScreen 
                            onLogin={handleLogin} 
                            toast={toast}
                            supabaseConfigured={!!(supabaseUrl && supabaseKey && supabaseClient)}
                            onOpenSettings={() => setIsConfigOpen(true)}
                            isLoading={isLoading}
                            supabaseUrl={supabaseUrl}
                            supabaseKey={supabaseKey}
                            supabaseClient={supabaseClient}
                            clientError={clientError}
                        />
                        {isConfigOpen && (
                            <ConfigModal 
                                onClose={() => setIsConfigOpen(false)}
                                supabaseUrl={supabaseUrl}
                                setSupabaseUrl={setSupabaseUrl}
                                supabaseKey={supabaseKey}
                                setSupabaseKey={setSupabaseKey}
                                showToast={showToast}
                            />
                        )}
                    </React.Fragment>
                );
            }

            return (
                <div className="flex flex-col min-h-screen">
                    {/* Topbar Header */}
                    <header className="glass-header text-white border-b border-slate-700/60 sticky top-0 z-40 no-print">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 py-3.5 flex flex-wrap items-center justify-between gap-4">
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 rounded-xl bg-blue-600/30 border border-blue-400/40 flex items-center justify-center text-xl shadow-inner">
                                    📊
                                </div>
                                <div>
                                    <h1 className="text-lg font-bold tracking-tight text-white flex items-center gap-2">
                                        AttendEase
                                        <span className="text-[10px] font-semibold bg-emerald-500/20 text-emerald-300 border border-emerald-400/30 px-2 py-0.5 rounded-full uppercase tracking-wider flex items-center gap-1">
                                            <span className="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
                                            Supabase Connected
                                        </span>
                                    </h1>
                                    <p className="text-xs text-slate-300">College Attendance & Academic Timetable System</p>
                                </div>
                            </div>

                            <div className="flex items-center gap-2.5 flex-wrap">
                                <div className="flex items-center gap-2 bg-slate-800/80 border border-slate-700 px-3 py-1.5 rounded-lg text-xs">
                                    <span className="text-slate-400">User:</span>
                                    <span className="font-semibold text-slate-200">{currentUser.email}</span>
                                    <span className={`px-2 py-0.5 rounded-full text-[11px] font-semibold ${
                                        currentUser.role === 'admin' 
                                            ? 'bg-purple-500/20 text-purple-300 border border-purple-400/30' 
                                            : currentUser.role === 'student'
                                            ? 'bg-blue-500/20 text-blue-300 border border-blue-400/30'
                                            : 'bg-emerald-500/20 text-emerald-300 border border-emerald-400/30'
                                    }`}>
                                        {currentUser.role.toUpperCase()}
                                    </span>
                                </div>

                                <button
                                    onClick={fetchAllData}
                                    title="Reload latest data from Supabase"
                                    disabled={isLoading}
                                    className="p-2 text-slate-300 hover:text-white bg-slate-800/80 hover:bg-slate-700 border border-slate-700 rounded-lg transition text-xs flex items-center gap-1"
                                >
                                    🔄 {isLoading ? 'Syncing...' : 'Sync'}
                                </button>

                                {currentUser.role === 'admin' && (
                                    <button
                                        onClick={() => setIsConfigOpen(true)}
                                        title="Supabase Backend Credentials (Admin Only)"
                                        className="p-2 text-slate-300 hover:text-white bg-slate-800/80 hover:bg-slate-700 border border-slate-700 rounded-lg transition text-sm"
                                    >
                                        ⚙️
                                    </button>
                                )}

                                <button
                                    onClick={handleLogout}
                                    className="px-3.5 py-1.5 text-xs font-semibold rounded-lg bg-red-600/80 hover:bg-red-600 text-white transition shadow-sm"
                                >
                                    Log out
                                </button>
                            </div>
                        </div>

                        {/* Navigation Tabs */}
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 flex gap-1 overflow-x-auto text-xs font-medium border-t border-slate-800 pt-2 pb-2">
                            {currentUser.role === 'student' ? (
                                <>
                                    <TabBtn active={activeTab === 'student_attendance'} onClick={() => setActiveTab('student_attendance')} icon="📊" label="My Attendance" />
                                    <TabBtn active={activeTab === 'student_timetable'} onClick={() => setActiveTab('student_timetable')} icon="📅" label="Class Timetable" />
                                    <TabBtn active={activeTab === 'student_history'} onClick={() => setActiveTab('student_history')} icon="📜" label="Attendance Log" />
                                </>
                            ) : (
                                <>
                                    <TabBtn active={activeTab === 'dashboard'} onClick={() => setActiveTab('dashboard')} icon="📊" label="Dashboard" />
                                    <TabBtn active={activeTab === 'attendance'} onClick={() => setActiveTab('attendance')} icon="📝" label="Mark Attendance" />
                                    <TabBtn active={activeTab === 'timetable'} onClick={() => setActiveTab('timetable')} icon="📅" label="Weekly Timetable" />
                                    <TabBtn active={activeTab === 'overrides'} onClick={() => setActiveTab('overrides')} icon="🔄" label="Daily Changes" />
                                    <TabBtn active={activeTab === 'sessions'} onClick={() => setActiveTab('sessions')} icon="🏫" label="Class Sessions" />
                                    <TabBtn active={activeTab === 'reports'} onClick={() => setActiveTab('reports')} icon="📈" label="Attendance Reports" />
                                    <TabBtn active={activeTab === 'defaulters'} onClick={() => setActiveTab('defaulters')} icon="⚠️" label="Defaulter Alert (<75%)" />
                                    {currentUser.role === 'admin' && (
                                        <TabBtn active={activeTab === 'setup'} onClick={() => setActiveTab('setup')} icon="🛠️" label="Admin Setup" badge="Admin" />
                                    )}
                                </>
                            )}
                        </div>
                    </header>

                    {/* Toast Notification */}
                    {toast && (

        // ---------------------------------------------------------
        // 1. DASHBOARD & KPIS VIEW
        // ---------------------------------------------------------
        function DashboardView({ db, currentUser, setActiveTab }) {
            const totalStudents = db.students.length;
            const totalClasses = db.classes.length;
            const totalSubjects = db.subjects.length;
            const totalAttendanceRecords = db.attendance.length;

            const presentCount = db.attendance.filter(a => a.status === 'present').length;
            const overallRate = totalAttendanceRecords > 0 
                ? ((presentCount / totalAttendanceRecords) * 100).toFixed(1)
                : '0.0';

            const defaulters = useMemo(() => {
                const list = [];
                db.students.forEach(st => {
                    const records = db.attendance.filter(a => a.studentId === st.id);
                    if (records.length > 0) {
                        const p = records.filter(r => r.status === 'present').length;
                        const pct = (p / records.length) * 100;
                        if (pct < 75) {
                            const cl = db.classes.find(c => c.id === st.classId);
                            list.push({ ...st, className: cl ? cl.name : 'N/A', percent: pct.toFixed(1), total: records.length, present: p });

                return list;

            return (

                            </p>
                            <div className="mt-4 flex gap-3 flex-wrap">
                                <button
                                    onClick={() => setActiveTab('attendance')}
                                    className="bg-white text-blue-700 font-semibold px-4 py-2 rounded-xl text-xs hover:bg-blue-50 transition shadow-sm"
                                >
                                    📝 Take Today's Attendance
                                </button>
                                <button
                                    onClick={() => setActiveTab('timetable')}
                                    className="bg-white/10 hover:bg-white/20 border border-white/20 text-white font-medium px-4 py-2 rounded-xl text-xs transition"
                                >
                                    📅 View Today's Schedule
                                </button>
                            </div>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                        <MetricCard title="Total Enrolled Students" value={totalStudents} icon="🎓" subtitle={`${totalClasses} Active Classes`} />
                        <MetricCard title="Registered Subjects" value={totalSubjects} icon="📚" subtitle="In live database" />
                        <MetricCard title="Attendance Records" value={totalAttendanceRecords} icon="📝" subtitle="Recorded Period Logs" />
                        <MetricCard title="Overall Attendance %" value={`${overallRate}%`} icon="📈" subtitle="Institutional Average" />
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        <div className="lg:col-span-2 bg-white rounded-2xl p-5 border border-slate-200 shadow-sm">
                            <div className="flex justify-between items-center mb-4">
                                <div>
                                    <h3 className="font-bold text-slate-800 text-base">Weekly Schedule Entries</h3>
                                    <p className="text-xs text-slate-500">Live periods scheduled in database</p>
                                </div>
                                <button
                                    onClick={() => setActiveTab('timetable')}
                                    className="text-xs text-blue-600 hover:text-blue-700 font-medium"
                                >
                                    Full Timetable Grid →
                                </button>
                            </div>

                            <div className="overflow-x-auto">

                                            <th className="p-2.5">Class</th>
                                            <th className="p-2.5">Subject</th>
                                            <th className="p-2.5">Room</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-100">
                                        {db.timetable.length === 0 ? (
                                            <tr>

                                                    No timetable entries created in database yet. Add periods in Weekly Timetable.

                                            db.timetable.slice(0, 5).map(t => {

                                                const sub = db.subjects.find(s => s.id === t.subjectId);

                                                    <tr key={t.id} className="hover:bg-slate-50/70">
                                                        <td className="p-2.5 font-semibold text-slate-700">{DAYS[t.day]}</td>

                                                        </td>
                                                        <td className="p-2.5 font-medium">{cl ? cl.name : 'N/A'}</td>
                                                        <td className="p-2.5">{sub ? sub.name : 'N/A'}</td>
                                                        <td className="p-2.5 font-mono text-[11px] text-slate-600">{t.room || '-'}</td>
                                                    </tr>

                                            })

                                </table>

                        <div className="bg-white rounded-2xl p-5 border border-slate-200 shadow-sm flex flex-col justify-between">
                            <div>
                                <div className="flex items-center justify-between mb-3">
                                    <h3 className="font-bold text-slate-800 text-base flex items-center gap-1.5">
                                        <span className="text-red-500">⚠️</span> Defaulter Watch (<span className="text-red-600 font-bold">&lt;75%</span>)

                                        {defaulters.length} Students

                                    Students with low attendance from live records.

                                        No students currently below 75% attendance.
                                    </div>

                                    <div className="space-y-2.5 max-h-60 overflow-y-auto pr-1">
                                        {defaulters.slice(0, 4).map(d => (
                                            <div key={d.id} className="p-2.5 rounded-xl border border-red-100 bg-red-50/40 flex justify-between items-center text-xs">
                                                <div>
                                                    <p className="font-semibold text-slate-800">{d.name} <span className="text-slate-400 font-normal">({d.rollNo})</span></p>
                                                    <p className="text-[11px] text-slate-500">{d.className} · {d.present}/{d.total} periods</p>

                            <button

                            >

                            </button>
