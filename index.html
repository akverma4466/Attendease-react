            useEffect(() => {
                if (db.teachers.length > 0 && !assignTeacherId) {
                    setAssignTeacherId(db.teachers[0].id);
                }
            }, [db.teachers, assignTeacherId]);

            // --- 1. CREATE TEACHER ID & ACCOUNT ---
            const handleCreateTeacher = async (e) => {
                e.preventDefault();
                if (!teacherName.trim() || !teacherEmail.trim() || !teacherPassword) {
                    showToast('Please fill all teacher account fields', 'error');
                    return;
                }

                setIsCreatingTeacher(true);
                try {
                    // Create Supabase Auth user without overriding current admin session
                    let createdUserId = null;
                    if (supabaseUrl && supabaseKey && window.supabase) {
                        try {
                            const ephemeral = window.supabase.createClient(supabaseUrl, supabaseKey, {
                                auth: { persistSession: false, autoRefreshToken: false }
                            });
                            const { data: authData, error: authError } = await ephemeral.auth.signUp({
                                email: teacherEmail.trim().toLowerCase(),
                                password: teacherPassword,
                                options: {
                                    data: {
                                        full_name: teacherName.trim(),
                                        role: 'teacher',
                                        department: teacherDept.trim()
                                    }
                                }
                            });
                            if (authError && !authError.message.includes('already registered')) {
                                throw authError;
                            }
                            if (authData?.user) {
                                createdUserId = authData.user.id;
                            }
                        } catch (authErr) {
                            console.warn('Ephemeral auth note:', authErr);
                        }
                    }

                    // Insert or upsert into public.teachers table
                    if (supabaseClient) {
                        const { error } = await supabaseClient
                            .from('teachers')
                            .upsert({
                                user_id: createdUserId,
                                name: teacherName.trim(),
                                email: teacherEmail.trim().toLowerCase(),
                                department: teacherDept.trim()
                            }, { onConflict: 'email' });

                        if (error) throw error;
                    }

                    showToast(`Teacher account created for "${teacherName.trim()}"!`, 'success');
                    setTeacherName('');
                    setTeacherEmail('');
                    setTeacherPassword('Teacher@123');
                    if (onRefresh) onRefresh();
                } catch (err) {
                    showToast('Failed to create teacher account: ' + err.message, 'error');
                } finally {
                    setIsCreatingTeacher(false);
                }
            };

            const handleDeleteTeacher = async (teacherId, teacherName) => {
                if (!confirm(`Are you sure you want to remove teacher "${teacherName}"?`)) return;
                try {
                    if (supabaseClient) {
                        const { error } = await supabaseClient
                            .from('teachers')
                            .delete()
                            .eq('id', teacherId);
                        if (error) throw error;
                    }
                    showToast(`Teacher "${teacherName}" removed`, 'info');
                    if (onRefresh) onRefresh();
                } catch (err) {
                    showToast('Failed to delete teacher: ' + err.message, 'error');
                }
            };

            // --- 2. CREATE STUDENT ID & ACCOUNT ---
            const handleCreateStudent = async (e) => {
                e.preventDefault();
                const effectiveClassId = studentClassId || db.classes[0]?.id;
                if (!studentRoll.trim() || !studentName.trim() || !effectiveClassId) {
                    showToast('Roll number, name, and class are required', 'error');
                    return;
                }

                setIsCreatingStudent(true);
                try {
                    const finalEmail = studentEmail.trim() 
                        ? studentEmail.trim().toLowerCase() 
                        : `${studentRoll.trim().toLowerCase()}@college.edu`;

                    let createdUserId = null;
                    if (supabaseUrl && supabaseKey && window.supabase && studentPassword) {
                        try {
                            const ephemeral = window.supabase.createClient(supabaseUrl, supabaseKey, {
                                auth: { persistSession: false, autoRefreshToken: false }
                            });
                            const { data: authData, error: authError } = await ephemeral.auth.signUp({
                                email: finalEmail,
                                password: studentPassword,
                                options: {
                                    data: {
                                        full_name: studentName.trim(),
                                        role: 'student',
                                        roll_no: studentRoll.trim()
                                    }
                                }
                            });
                            if (authError && !authError.message.includes('already registered')) {
                                throw authError;
                            }
                            if (authData?.user) {
                                createdUserId = authData.user.id;
                            }
                        } catch (authErr) {
                            console.warn('Ephemeral auth student note:', authErr);
                        }
                    }

                    if (supabaseClient) {
                        // Check if student with this roll_no and class_id already exists
                        const { data: existingStudent } = await supabaseClient
                            .from('students')
                            .select('id')
                            .eq('class_id', effectiveClassId)
                            .eq('roll_no', studentRoll.trim())
                            .maybeSingle();

                        const studentPayload = {
                            teacher_id: currentUser.id,
                            class_id: effectiveClassId,
                            roll_no: studentRoll.trim(),
                            name: studentName.trim(),
                            email: finalEmail
                        };
                        if (createdUserId) {
                            studentPayload.auth_user_id = createdUserId;
                        }

                        let studentDbError = null;
                        if (existingStudent) {
                            const { error } = await supabaseClient
                                .from('students')
                                .update(studentPayload)
                                .eq('id', existingStudent.id);
                            studentDbError = error;
                        } else {
                            const { error } = await supabaseClient
                                .from('students')
                                .insert(studentPayload);
                            studentDbError = error;
                        }

                        // Resilient fallback if schema in Supabase lacks 'email' or 'auth_user_id' column
                        if (studentDbError && (studentDbError.message.includes('column') || studentDbError.message.includes('schema cache'))) {
                            delete studentPayload.email;
                            delete studentPayload.auth_user_id;
                            if (existingStudent) {
                                const { error } = await supabaseClient.from('students').update(studentPayload).eq('id', existingStudent.id);
                                studentDbError = error;
                            } else {
                                const { error } = await supabaseClient.from('students').insert(studentPayload);
                                studentDbError = error;
                            }
                        }

                        if (studentDbError) throw studentDbError;
                    }

                    showToast(`Student "${studentName.trim()}" (Roll: ${studentRoll.trim()}) registered!`, 'success');
                    setStudentRoll('');
                    setStudentName('');
                    setStudentEmail('');
                    setStudentPassword('Student@123');
                    if (onRefresh) onRefresh();
                } catch (err) {
                    showToast('Failed to create student: ' + err.message, 'error');
                } finally {
                    setIsCreatingStudent(false);
                }
            };

            const handleDeleteStudent = async (studentId, studentName) => {
                if (!confirm(`Are you sure you want to remove student "${studentName}"?`)) return;
                try {
                    if (supabaseClient) {
                        const { error } = await supabaseClient
                            .from('students')
                            .delete()
                            .eq('id', studentId);
                        if (error) throw error;
                    }
                    showToast(`Student "${studentName}" removed`, 'info');
                    if (onRefresh) onRefresh();
                } catch (err) {
                    showToast('Failed to delete student: ' + err.message, 'error');
                }
            };

            // --- 3. EXCEL BULK IMPORT ---
            const handleExcelUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (evt) => {
                    try {
                        const data = new Uint8Array(evt.target.result);
                        const workbook = XLSX.read(data, { type: 'array' });
                        const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                        const rows = XLSX.utils.sheet_to_json(firstSheet);

                        const normalized = rows.map((r, idx) => {
                            const rollKey = Object.keys(r).find(k => /^(roll|roll_no|rollno|roll_number)$/i.test(k.trim()));
                            const nameKey = Object.keys(r).find(k => /^(name|student_name|student)$/i.test(k.trim()));
                            const emailKey = Object.keys(r).find(k => /^(email|email_address)$/i.test(k.trim()));
                            const rNo = rollKey ? String(r[rollKey]).trim() : `R-${idx + 1}`;
                            return {
                                rollNo: rNo,
                                name: nameKey ? String(r[nameKey]).trim() : 'Unknown',
                                email: emailKey ? String(r[emailKey]).trim().toLowerCase() : `${rNo.toLowerCase()}@college.edu`
                            };
                        }).filter(item => item.rollNo && item.name);

                        setParsedPreview(normalized);
                        showToast(`Parsed ${normalized.length} students from Excel file`, 'info');
                    } catch (err) {
                        showToast('Error parsing Excel: ' + err.message, 'error');
                    }
                };
                reader.readAsArrayBuffer(file);
            };

            const commitExcelImport = async () => {
                const effectiveImportClassId = importClassId || db.classes[0]?.id;
                if (parsedPreview.length === 0 || !effectiveImportClassId) {
                    showToast('No parsed students or class not selected', 'error');
                    return;
                }

                try {
                    const studentRecords = parsedPreview.map(item => ({
                        teacher_id: currentUser.id,
                        class_id: effectiveImportClassId,
                        roll_no: item.rollNo,
                        name: item.name,
                        email: item.email
                    }));

                    if (supabaseClient) {
                        let { error } = await supabaseClient
                            .from('students')
                            .upsert(studentRecords, {
                                onConflict: 'class_id,roll_no'
                            });

                        // Fallback if email column not in schema or conflict spec mismatch
                        if (error) {
                            console.warn('Batch upsert warning, attempting individual safe upsert:', error);
                            for (const rec of studentRecords) {
                                const { data: ex } = await supabaseClient
                                    .from('students')
                                    .select('id')
                                    .eq('class_id', effectiveImportClassId)
                                    .eq('roll_no', rec.roll_no)
                                    .maybeSingle();

                                const payload = { ...rec };
                                if (ex) {
                                    await supabaseClient.from('students').update(payload).eq('id', ex.id);
                                } else {
                                    await supabaseClient.from('students').insert(payload);
                                }
                            }
                        }
                    }

                    setParsedPreview([]);
                    showToast(`Successfully imported ${studentRecords.length} students into Supabase`, 'success');
                    if (onRefresh) onRefresh();
                } catch (err) {
                    showToast('Import error: ' + err.message, 'error');
                }
            };

            const downloadSampleExcel = () => {

                    { roll_no: '102', name: 'Priya Sharma', email: 'priya.sharma@college.edu' },
                    { roll_no: '103', name: 'Aman Singh', email: 'aman.singh@college.edu' }

                const ws = XLSX.utils.json_to_sheet(sampleRows);

                XLSX.utils.book_append_sheet(wb, ws, 'Students_Template');

                const effectiveSubjectId = assignSubjectId || availableAssignmentSubjects[0]?.id;

                    return;

                try {

                            .from('teacher_assignments')
                            .select('id')
                            .eq('class_id', effectiveClassId)
                            .eq('subject_id', effectiveSubjectId)
                            .maybeSingle();

                        const payload = {
                            teacher_id: effectiveTeacherId,
                            class_id: effectiveClassId,
                            subject_id: effectiveSubjectId,
                            admin_id: currentUser.id || null
                        };

                        let assignError = null;
                        if (existingAssignment) {
                            const { error } = await supabaseClient
                                .from('teacher_assignments')
                                .update(payload)
                                .eq('id', existingAssignment.id);
                            assignError = error;
                        } else {
                            const { error } = await supabaseClient
                                .from('teacher_assignments')
                                .insert(payload);
                            assignError = error;
                        }

                        // Fallback if foreign key constraint on admin_id or teacher_id fails
                        if (assignError && assignError.message.includes('foreign key')) {
                            console.warn('Foreign key retry with minimal payload:', assignError);
                            delete payload.admin_id;
                            if (existingAssignment) {
                                const { error } = await supabaseClient
                                    .from('teacher_assignments')
                                    .update(payload)
                                    .eq('id', existingAssignment.id);
                                assignError = error;
                            } else {
                                const { error } = await supabaseClient
                                    .from('teacher_assignments')
                                    .insert(payload);
                                assignError = error;
                            }
                        }

                        if (assignError) throw assignError;

                            <button

                            >
                                📋 Assign Teachers

                            <button

                            {/* Registered Teachers List Table */}

        // ---------------------------------------------------------
        // 9. CONFIGURATION MODAL (Verify, Test, & Save Credentials)
        // ---------------------------------------------------------
        function ConfigModal({ onClose, supabaseUrl, setSupabaseUrl, supabaseKey, setSupabaseKey, showToast }) {
            const [localUrl, setLocalUrl] = useState(supabaseUrl || '');
            const [localKey, setLocalKey] = useState(supabaseKey || '');
            const [testing, setTesting] = useState(false);
            const [testResult, setTestResult] = useState(null);

            const handleTest = async () => {
                setTesting(true);
                setTestResult(null);
                try {
                    const cleanU = sanitizeInput(localUrl);
                    const cleanK = sanitizeInput(localKey);
                    if (!cleanU) throw new Error("Project URL cannot be empty.");
                    if (!cleanK) throw new Error("Anon Public Key cannot be empty.");
                    if (!window.supabase) throw new Error("Supabase library not loaded. Check internet.");

                    const testClient = window.supabase.createClient(cleanU, cleanK);
                    const { error } = await testClient.auth.getSession();
                    if (error) throw error;
                    setTestResult({ ok: true, msg: "Connected to Supabase successfully! URL and Key are valid." });
                } catch (err) {
                    setTestResult({ ok: false, msg: err.message || "Connection failed. Please check your credentials." });
                } finally {
                    setTesting(false);
                }
            };

            const handleSave = (e) => {
                e.preventDefault();
                const cleanUrl = sanitizeInput(localUrl);
                const cleanKey = sanitizeInput(localKey);
                setLocalUrl(cleanUrl);
                setLocalKey(cleanKey);
                setSupabaseUrl(cleanUrl);
                setSupabaseKey(cleanKey);
                localStorage.setItem('supabase_url', cleanUrl);
                localStorage.setItem('supabase_key', cleanKey);
                showToast('Supabase settings saved and connected!', 'success');
                onClose();
            };

            const handleReset = () => {
                localStorage.removeItem('supabase_url');
                localStorage.removeItem('supabase_key');
                const defaultUrl = sanitizeInput(CONFIGURED_URL);
                const defaultKey = sanitizeInput(CONFIGURED_KEY);
                setLocalUrl(defaultUrl);
                setLocalKey(defaultKey);
                setSupabaseUrl(defaultUrl);
                setSupabaseKey(defaultKey);
                setTestResult(null);
                showToast('Reset to configuration file values', 'info');
            };

            return (
                <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4">
                    <div className="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl border border-slate-200 space-y-4 max-h-[90vh] overflow-y-auto">
                        <div className="flex justify-between items-center border-b pb-3">
                            <div>
                                <h3 className="font-bold text-slate-800 text-base flex items-center gap-2">
                                    <span>⚙️</span> Supabase Connection Settings
                                </h3>
                                <p className="text-xs text-slate-500 mt-0.5">Verify & update your Supabase backend credentials</p>
                            </div>
                            <button onClick={onClose} className="text-slate-400 hover:text-slate-600 text-xl font-bold">
                                &times;
                            </button>
                        </div>

                        {/* Guide Banner */}
                        <div className="bg-blue-50 border border-blue-200 rounded-xl p-3 text-xs text-blue-900 space-y-1.5">
                            <div className="font-semibold flex items-center gap-1.5 text-blue-800">
                                <span>📍</span> Where to find these in your open Supabase tab:
                            </div>
                            <ol className="list-decimal list-inside space-y-1 text-slate-700 pl-1">
                                <li>Look at your browser tab: <strong>API Keys | Settings</strong></li>
                                <li>Under <strong>Project URL</strong>: Copy the URL (starts with <code>https://...</code>)</li>
                                <li>Under <strong>Project API keys</strong>: Copy the <strong>anon public</strong> key (long key starting with <code>eyJ...</code>)</li>
                            </ol>
                        </div>

                        <form onSubmit={handleSave} className="space-y-4">
                            <div>
                                <div className="flex justify-between items-center mb-1">
                                    <label className="text-xs font-semibold text-slate-700">
                                        Supabase Project URL
                                    </label>
                                    <button
                                        type="button"
                                        onClick={() => setLocalUrl("https://uzdkiwvzluznucjcynqg.supabase.co")}
                                        className="text-[11px] text-blue-600 hover:text-blue-800 underline font-medium"
                                    >
                                        Auto-fill uzdkiwvzluznucjcynqg
                                    </button>
                                </div>
                                <input
                                    type="text"
                                    value={localUrl}
                                    onChange={e => setLocalUrl(e.target.value)}
                                    onBlur={() => setLocalUrl(sanitizeInput(localUrl))}
                                    onPaste={(e) => {
                                        const pasted = e.clipboardData ? e.clipboardData.getData('text') : '';
                                        if (pasted) {
                                            setTimeout(() => setLocalUrl(sanitizeInput(pasted)), 10);
                                        }
                                    }}
                                    placeholder="https://your-ref.supabase.co"
                                    className="w-full text-xs p-2.5 rounded-lg border border-slate-300 bg-white font-mono"
                                    required
                                />
                            </div>

                            <div>
                                <div className="flex justify-between items-center mb-1">
                                    <label className="text-xs font-semibold text-slate-700 block">
                                        Supabase Anon Public Key (JWT)
                                    </label>
                                    <span className="text-[10px] text-amber-600 font-medium">Must be 'anon public' (starts with eyJ...)</span>
                                </div>
                                <textarea
                                    rows="3"
                                    value={localKey}
                                    onChange={e => setLocalKey(e.target.value)}
                                    onBlur={() => setLocalKey(sanitizeInput(localKey))}
                                    onPaste={(e) => {
                                        const pasted = e.clipboardData ? e.clipboardData.getData('text') : '';
                                        if (pasted) {
                                            setTimeout(() => setLocalKey(sanitizeInput(pasted)), 10);
                                        }
                                    }}
                                    placeholder="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                                    className="w-full text-xs p-2.5 rounded-lg border border-slate-300 bg-white font-mono break-all"
                                    required
                                />
                            </div>

                            {/* Live Test Feedback */}
                            {testResult && (
                                <div className={`p-3 rounded-xl text-xs font-medium border flex items-start gap-2 ${
                                    testResult.ok ? 'bg-emerald-50 border-emerald-300 text-emerald-800' : 'bg-red-50 border-red-300 text-red-800'
                                }`}>
                                    <span>{testResult.ok ? '✅' : '❌'}</span>
                                    <span>{testResult.msg}</span>
                                </div>
                            )}

                            <div className="pt-2 flex flex-wrap items-center justify-between gap-2 border-t border-slate-100">
                                <div className="flex gap-2">
                                    <button
                                        type="button"
                                        onClick={handleTest}
                                        disabled={testing}
                                        className="px-3 py-1.5 text-xs font-semibold rounded-lg bg-indigo-50 hover:bg-indigo-100 text-indigo-700 border border-indigo-200 transition"
                                    >
                                        {testing ? 'Testing...' : '⚡ Test Connection'}
                                    </button>
                                    <button
                                        type="button"
                                        onClick={handleReset}
                                        className="px-3 py-1.5 text-xs font-semibold rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-600 transition"
                                        title="Clear browser cache and reset to default"
                                    >
                                        🔄 Reset
                                    </button>
                                </div>

                                <div className="flex gap-2">
                                    <button
                                        type="button"
                                        onClick={onClose}
                                        className="px-3.5 py-1.5 text-xs font-semibold rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 transition"
                                    >
                                        Cancel
                                    </button>
                                    <button
                                        type="submit"
                                        className="px-4 py-1.5 text-xs font-bold rounded-lg bg-blue-600 hover:bg-blue-700 text-white transition shadow-sm"
                                    >
                                        Save & Connect
                                    </button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            );
        }

        // ---------------------------------------------------------
        // 10. AUTH LOGIN SCREEN (Secured: Only Admin Can Issue IDs)
        // ---------------------------------------------------------
        function AuthScreen({ onLogin, toast, supabaseConfigured, onOpenSettings, isLoading, supabaseUrl, supabaseKey, supabaseClient, clientError }) {
            const [identifier, setIdentifier] = useState('');
            const [password, setPassword] = useState('');

            const submit = (e) => {
                e.preventDefault();
                onLogin(identifier, password);
            };

            return (
                <div className="min-h-screen bg-gradient-to-br from-slate-900 via-indigo-950 to-blue-950 flex flex-col items-center justify-center p-4">
                    {toast && (
                        <div className={`fixed top-5 right-5 z-50 px-4 py-3 rounded-xl shadow-lg border text-sm font-medium ${
                            toast.type === 'success' ? 'bg-emerald-50 border-emerald-300 text-emerald-800' :
                            toast.type === 'error' ? 'bg-red-50 border-red-300 text-red-800' :
                            'bg-blue-50 border-blue-300 text-blue-800'
                        }`}>
                            {toast.message}
                        </div>
                    )}

                    <div className="w-full max-w-md bg-white rounded-3xl p-8 shadow-2xl border border-slate-100 space-y-6">
                        <div className="text-center space-y-2">
                            <div className="w-14 h-14 rounded-2xl bg-blue-600/10 border border-blue-500/20 text-3xl flex items-center justify-center mx-auto shadow-inner">
                                📊
                            </div>
                            <h1 className="text-2xl font-bold text-slate-800 tracking-tight">AttendEase</h1>
                            <p className="text-xs text-slate-500">College Attendance & Academic Portal</p>
                        </div>

                        {/* Notice for Students & Faculty */}
                        <div className="bg-slate-50 border border-slate-200 p-3.5 rounded-2xl text-xs text-slate-600 space-y-1">
                            <div className="font-semibold text-slate-800 flex items-center gap-1.5">
                                <span>🔐</span> Authorized Academic Portal
                            </div>
                            <p className="text-[11px] text-slate-500 leading-relaxed">
                                Teacher & Student IDs are issued solely by College Administration. Enter your College Email or Student Roll Number to sign in.
                            </p>
                        </div>

                        {/* Initial setup prompt ONLY if supabase is completely unconfigured */}
                        {!supabaseConfigured && (
                            <div className="bg-amber-50 border border-amber-200 p-3 rounded-xl text-xs text-amber-800">
                                <strong>Administrator Setup Needed:</strong> Please configure your Supabase URL & Key.
                                <button
                                    type="button"
                                    onClick={onOpenSettings}
                                    className="mt-2 block w-full bg-amber-600 text-white font-semibold py-1.5 rounded-lg text-center"
                                >
                                    ⚙️ Enter Supabase Credentials
                                </button>
                            </div>
                        )}

                        <form onSubmit={submit} className="space-y-4">
                            <div>
                                <label className="text-xs font-semibold text-slate-700 block mb-1">
                                    College Email or Student Roll Number
                                </label>
                                <input
                                    type="text"
                                    value={identifier}
                                    onChange={e => setIdentifier(e.target.value)}
                                    placeholder="e.g. 101 or teacher@college.edu"
                                    className="w-full text-xs p-3 rounded-xl border border-slate-300 bg-white focus:ring-2 focus:ring-blue-500 outline-none transition"
                                    required
                                />
                            </div>

                            <div>
                                <label className="text-xs font-semibold text-slate-700 block mb-1">Password</label>
                                <input
                                    type="password"
                                    value={password}
                                    onChange={e => setPassword(e.target.value)}
                                    placeholder="••••••••••••"
                                    className="w-full text-xs p-3 rounded-xl border border-slate-300 bg-white focus:ring-2 focus:ring-blue-500 outline-none transition"
                                    required
                                />
                            </div>

                            <button
                                type="submit"
                                disabled={isLoading}
                                className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl text-xs shadow-md transition flex items-center justify-center gap-2"
                            >
                                {isLoading ? 'Authenticating...' : 'Sign In to Portal'}
                            </button>
                        </form>

                        <div className="text-center pt-2 border-t border-slate-100">
                            <span className="text-[11px] text-slate-400">
                                Need account access? Contact your College Administrator or HOD.
                            </span>
                        </div>
                    </div>
                </div>
            );
        }

        // Render React App
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
