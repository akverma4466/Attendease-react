                    </div>
                </div>
            );
        }

        function MetricCard({ title, value, icon, subtitle }) {
            return (
                <div className="bg-white rounded-2xl p-5 border border-slate-200 shadow-sm flex items-center gap-4">
                    <div className="w-12 h-12 rounded-xl bg-slate-50 border border-slate-100 flex items-center justify-center text-2xl shadow-inner">
                        {icon}
                    </div>
                    <div>
                        <span className="text-xs font-medium text-slate-500 block">{title}</span>
                        <strong className="text-2xl font-bold text-slate-800 leading-tight block">{value}</strong>
                        {subtitle && <span className="text-[11px] text-slate-400 mt-0.5 block">{subtitle}</span>}
                    </div>
                </div>
            );
        }

        // ---------------------------------------------------------
        // 1B. STUDENT DASHBOARD VIEW (Student Portal)
        // ---------------------------------------------------------
        function StudentDashboardView({ db, currentUser, activeTab, setActiveTab, showToast }) {
            // Find current student profile
            const student = useMemo(() => {
                if (currentUser.studentProfile) return currentUser.studentProfile;
                const authEmail = currentUser.email ? currentUser.email.toLowerCase() : '';
                const emailPrefix = authEmail.includes('@') ? authEmail.split('@')[0] : authEmail;
                return db.students.find(s => 
                    (s.email && s.email.toLowerCase() === authEmail) ||
                    (s.rollNo && s.rollNo.toLowerCase() === emailPrefix) ||
                    (s.authUserId && s.authUserId === currentUser.id)
                ) || null;
            }, [currentUser, db.students]);

            const studentClass = useMemo(() => {
                if (!student) return db.classes[0] || null;
                return db.classes.find(c => c.id === student.classId) || db.classes[0] || null;
            }, [student, db.classes]);

            // All attendance records for this student
            const studentAttendance = useMemo(() => {
                if (!student) return [];
                return db.attendance.filter(a => a.studentId === student.id);
            }, [student, db.attendance]);

            // Subjects for this class
            const classSubjects = useMemo(() => {
                if (!studentClass) return [];
                return db.subjects.filter(s => s.classId === studentClass.id);
            }, [studentClass, db.subjects]);

            // Subject-wise attendance calculation
            const subjectStats = useMemo(() => {
                return classSubjects.map(subj => {
                    const records = studentAttendance.filter(a => a.subjectId === subj.id);
                    const totalHeld = records.length;
                    const present = records.filter(a => a.status === 'present').length;
                    const absent = records.filter(a => a.status === 'absent').length;
                    const leave = records.filter(a => a.status === 'leave').length;
                    const percent = totalHeld > 0 ? ((present / totalHeld) * 100).toFixed(1) : '100.0';
                    
                    // Teacher assigned to this subject (match by profile id or auth user id)
                    const assignment = db.teacherAssignments.find(ta => ta.classId === studentClass?.id && ta.subjectId === subj.id);
                    const teacher = assignment ? db.teachers.find(t => t.id === assignment.teacherId || (t.userId && t.userId === assignment.teacherId)) : null;

                    return {
                        subject: subj,
                        teacherName: teacher ? teacher.name : 'Faculty Member',
                        totalHeld,
                        present,
                        absent,
                        leave,
                        percent: parseFloat(percent),
                        isDefaulter: parseFloat(percent) < 75.0 && totalHeld > 0
                    };
                });
            }, [classSubjects, studentAttendance, db.teacherAssignments, db.teachers, studentClass]);

            // Overall stats
            const totalHeld = studentAttendance.length;
            const totalPresent = studentAttendance.filter(a => a.status === 'present').length;
            const totalAbsent = studentAttendance.filter(a => a.status === 'absent').length;
            const totalLeave = studentAttendance.filter(a => a.status === 'leave').length;
            const overallPercent = totalHeld > 0 ? ((totalPresent / totalHeld) * 100).toFixed(1) : '100.0';
            const numPercent = parseFloat(overallPercent);
            const isDefaulter = numPercent < 75.0 && totalHeld > 0;

            // Target calculation
            let targetNotice = '';
            if (numPercent < 75.0 && totalHeld > 0) {
                const needed = Math.max(1, Math.ceil((0.75 * totalHeld - totalPresent) / 0.25));
                targetNotice = `Attendance Warning: You must attend the next ${needed} consecutive class${needed > 1 ? 'es' : ''} to reach the 75% examination threshold.`;
            } else if (totalHeld > 0) {
                const canMiss = Math.floor((totalPresent - 0.75 * totalHeld) / 0.75);
                targetNotice = canMiss > 0 
                    ? `Safe Zone: You can safely miss up to ${canMiss} class${canMiss > 1 ? 'es' : ''} and still maintain 75% attendance.`
                    : `You are exactly at 75%. Do not miss any upcoming lectures!`;
            }

            // Student Timetable for their class
            const myTimetable = useMemo(() => {
                if (!studentClass) return [];
                return db.timetable.filter(t => t.classId === studentClass.id);
            }, [studentClass, db.timetable]);

            // Today's day index: 0=Mon, 1=Tue, ..., 5=Sat, 6=Sun
            const todayJs = new Date().getDay();
            const todayDayOfWeek = todayJs === 0 ? 6 : todayJs - 1;
            const [selectedDay, setSelectedDay] = useState(todayDayOfWeek <= 5 ? todayDayOfWeek : 0);

            // Filter timetable for selected day
            const selectedDaySlots = useMemo(() => {
                return myTimetable
                    .filter(t => t.day === selectedDay)
                    .sort((a, b) => a.period - b.period);
            }, [myTimetable, selectedDay]);

            // Today's Date String: YYYY-MM-DD
            const todayDateStr = new Date().toISOString().slice(0, 10);
            const todayOverrides = useMemo(() => {
                if (!studentClass) return [];
                return db.overrides.filter(o => o.classId === studentClass.id && o.date === todayDateStr);
            }, [studentClass, db.overrides, todayDateStr]);

            // Subject Filter for Attendance History
            const [historySubjectFilter, setHistorySubjectFilter] = useState('all');
            const filteredAttendanceHistory = useMemo(() => {
                let list = [...studentAttendance].sort((a, b) => b.date.localeCompare(a.date) || b.period - a.period);
                if (historySubjectFilter !== 'all') {
                    list = list.filter(a => a.subjectId === historySubjectFilter);
                }
                return list;
            }, [studentAttendance, historySubjectFilter]);

            return (
                <div className="space-y-6">
                    {/* Student Hero Header */}
                    <div className="bg-gradient-to-r from-blue-900 via-indigo-900 to-slate-900 rounded-3xl p-6 text-white shadow-xl border border-blue-800/40 relative overflow-hidden">
                        <div className="relative z-10 flex flex-wrap justify-between items-center gap-6">
                            <div className="space-y-2">
                                <div className="flex items-center gap-2">
                                    <span className="bg-blue-500/30 border border-blue-400/40 text-blue-200 text-[11px] font-semibold px-2.5 py-0.5 rounded-full uppercase tracking-wider">
                                        🎓 Student Academic Portal
                                    </span>
                                    {isDefaulter ? (
                                        <span className="bg-red-500/30 border border-red-400/50 text-red-200 text-[11px] font-bold px-2.5 py-0.5 rounded-full flex items-center gap-1 animate-pulse">
                                            ⚠️ Attendance Shortage (&lt;75%)
                                        </span>
                                    ) : (
                                        <span className="bg-emerald-500/30 border border-emerald-400/50 text-emerald-200 text-[11px] font-bold px-2.5 py-0.5 rounded-full flex items-center gap-1">
                                            ✅ Examination Eligible (&ge;75%)
                                        </span>
                                    )}
                                </div>
                                <h1 className="text-2xl font-bold tracking-tight">
                                    {student ? student.name : currentUser.name}
                                </h1>
                                <div className="flex flex-wrap items-center gap-4 text-xs text-slate-300 font-medium">
                                    <span><strong>Roll No:</strong> {student?.rollNo || 'Enrolled'}</span>
                                    <span>•</span>
                                    <span><strong>Class:</strong> {studentClass ? studentClass.name : 'Alloted Section'}</span>
                                    <span>•</span>
                                    <span><strong>Department:</strong> {studentClass?.department || 'General'}</span>
                                </div>
                            </div>

                            {/* Overall Percentage Badge */}
                            <div className="flex items-center gap-4 bg-white/10 backdrop-blur-md border border-white/20 p-4 rounded-2xl">
                                <div className="text-center">
                                    <div className="text-3xl font-extrabold tracking-tight">
                                        <span className={isDefaulter ? 'text-red-400' : 'text-emerald-400'}>
                                            {overallPercent}%
                                        </span>
                                    </div>
                                    <div className="text-[11px] text-slate-300 uppercase tracking-wider font-semibold">
                                        Overall Attendance
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* Attendance Advice Alert */}
                        {targetNotice && (
                            <div className={`mt-4 p-3 rounded-xl text-xs font-medium border flex items-center gap-2 ${
                                isDefaulter 
                                    ? 'bg-red-950/60 border-red-800/80 text-red-200' 
                                    : 'bg-emerald-950/60 border-emerald-800/80 text-emerald-200'
                            }`}>
                                <span>{isDefaulter ? '🚨' : '🎯'}</span>
                                <span>{targetNotice}</span>
                            </div>
                        )}
                    </div>

                    {/* KPI Quick Stats */}
                    <div className="grid grid-cols-2 sm:grid-cols-4 gap-4">
                        <div className="bg-white rounded-2xl p-4 border border-slate-200 shadow-sm">
                            <span className="text-xs text-slate-500 font-semibold uppercase">Total Classes</span>
                            <div className="text-2xl font-bold text-slate-800 mt-1">{totalHeld}</div>
                            <span className="text-[11px] text-slate-400">Total sessions held</span>
                        </div>
                        <div className="bg-white rounded-2xl p-4 border border-slate-200 shadow-sm">
                            <span className="text-xs text-emerald-600 font-semibold uppercase">Present</span>
                            <div className="text-2xl font-bold text-emerald-600 mt-1">{totalPresent}</div>
                            <span className="text-[11px] text-slate-400">Classes attended</span>
                        </div>
                        <div className="bg-white rounded-2xl p-4 border border-slate-200 shadow-sm">
                            <span className="text-xs text-red-600 font-semibold uppercase">Absent</span>
                            <div className="text-2xl font-bold text-red-600 mt-1">{totalAbsent}</div>
                            <span className="text-[11px] text-slate-400">Classes missed</span>
                        </div>
                        <div className="bg-white rounded-2xl p-4 border border-slate-200 shadow-sm">
                            <span className="text-xs text-amber-600 font-semibold uppercase">Approved Leave</span>
                            <div className="text-2xl font-bold text-amber-600 mt-1">{totalLeave}</div>
                            <span className="text-[11px] text-slate-400">Authorized leaves</span>
                        </div>
                    </div>

                    {/* View Selection: Subject-Wise Breakdown */}
                    {activeTab === 'student_attendance' && (
                        <div className="space-y-4">
                            <div className="flex justify-between items-center">
                                <h2 className="text-base font-bold text-slate-800 flex items-center gap-2">
                                    <span>📊</span> Subject-Wise Attendance Breakdown
                                </h2>
                                <span className="text-xs text-slate-500">
                                    Mandatory threshold: <strong>75%</strong>
                                </span>
                            </div>

                            {subjectStats.length === 0 ? (
                                <div className="bg-white rounded-2xl p-8 border border-slate-200 text-center text-slate-400 text-xs">
                                    No subjects or attendance data found for your enrolled class.
                                </div>
                            ) : (
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    {subjectStats.map(stat => (
                                        <div key={stat.subject.id} className="bg-white rounded-2xl p-5 border border-slate-200 shadow-sm space-y-3 hover:border-slate-300 transition">
                                            <div className="flex justify-between items-start gap-2">
                                                <div>
                                                    <h3 className="font-bold text-slate-800 text-sm">{stat.subject.name}</h3>
                                                    <div className="text-xs text-slate-500">
                                                        Code: <span className="font-mono font-medium">{stat.subject.code || 'N/A'}</span> • Faculty: {stat.teacherName}
                                                    </div>
                                                </div>
                                                <span className={`px-2.5 py-1 rounded-full text-xs font-bold ${
                                                    stat.isDefaulter 
                                                        ? 'bg-red-50 text-red-700 border border-red-200' 
                                                        : 'bg-emerald-50 text-emerald-700 border border-emerald-200'
                                                }`}>
                                                    {stat.percent}%
                                                </span>
                                            </div>

                                            {/* Progress Bar */}
                                            <div className="w-full bg-slate-100 rounded-full h-2.5 overflow-hidden">
                                                <div 
                                                    className={`h-2.5 rounded-full transition-all duration-500 ${
                                                        stat.isDefaulter ? 'bg-red-500' : 'bg-emerald-500'
                                                    }`}
                                                    style={{ width: `${Math.min(stat.percent, 100)}%` }}
                                                ></div>
                                            </div>

                                            <div className="flex justify-between items-center text-xs text-slate-500 pt-1 border-t border-slate-100">
                                                <span>Attended: <strong>{stat.present} / {stat.totalHeld}</strong></span>
                                                <span>Missed: <strong>{stat.absent}</strong></span>
                                                <span className={stat.isDefaulter ? 'text-red-600 font-semibold' : 'text-emerald-600 font-semibold'}>
                                                    {stat.isDefaulter ? '⚠️ Below 75%' : '✅ Safe'}
                                                </span>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                    )}

                    {/* View Selection: Class Timetable */}
                    {activeTab === 'student_timetable' && (
                        <div className="space-y-4">
                            <div className="bg-white rounded-2xl p-6 border border-slate-200 shadow-sm space-y-4">
                                <div className="flex flex-wrap justify-between items-center gap-4 border-b pb-4">
                                    <div>
                                        <h2 className="text-base font-bold text-slate-800 flex items-center gap-2">
                                            <span>📅</span> Weekly Class Schedule
                                        </h2>
                                        <p className="text-xs text-slate-500">
                                            Period schedule & daily room allocations for {studentClass?.name || 'Your Section'}
                                        </p>
                                    </div>

                                    {/* Day Selector Pills */}
                                    <div className="flex flex-wrap gap-1 bg-slate-100 p-1 rounded-xl text-xs font-semibold">
                                        {['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].map((dayName, idx) => (
                                            <button
                                                key={idx}
                                                onClick={() => setSelectedDay(idx)}
                                                className={`px-3 py-1.5 rounded-lg transition ${
                                                    selectedDay === idx 
                                                        ? 'bg-blue-600 text-white shadow-sm' 
                                                        : 'text-slate-600 hover:text-slate-900'
                                                }`}
                                            >
                                                {dayName} {todayDayOfWeek === idx && '• Today'}
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                {/* Today's Live Overrides Warning */}
                                {todayOverrides.length > 0 && selectedDay === todayDayOfWeek && (
                                    <div className="bg-amber-50 border border-amber-200 p-3.5 rounded-xl text-xs text-amber-900 space-y-1">
                                        <strong className="flex items-center gap-1.5 text-amber-800">
                                            <span>⚡</span> Daily Schedule Notice for Today:
                                        </strong>
                                        {todayOverrides.map(ov => (
                                            <div key={ov.id}>
                                                • Period {ov.period}: {ov.isCancelled ? '❌ Class Cancelled' : `Room Change: ${ov.room || 'TBD'}`}
                                            </div>
                                        ))}
                                    </div>
                                )}

                                {/* Period Cards */}
                                {selectedDaySlots.length === 0 ? (
                                    <div className="p-8 text-center text-slate-400 text-xs italic">
                                        No lectures scheduled for {DAYS[selectedDay]}. Enjoy your free time!
                                    </div>
                                ) : (
                                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-3">
                                        {selectedDaySlots.map(slot => {
                                            const subj = db.subjects.find(s => s.id === slot.subjectId);
                                            const override = todayOverrides.find(o => o.period === slot.period && selectedDay === todayDayOfWeek);
                                            const isCancelled = override && override.isCancelled;

                                            return (
                                                <div 
                                                    key={slot.id} 
                                                    className={`p-4 rounded-xl border transition shadow-xs space-y-2 ${
                                                        isCancelled 
                                                            ? 'bg-red-50/60 border-red-200 opacity-70' 
                                                            : 'bg-white border-slate-200 hover:border-blue-300'
                                                    }`}
                                                >
                                                    <div className="flex justify-between items-center text-xs font-semibold">
                                                        <span className="bg-slate-100 text-slate-700 px-2 py-0.5 rounded-md font-mono">
                                                            Period {slot.period}
                                                        </span>
                                                        <span className="text-slate-400 text-[11px]">
                                                            {slot.startTime} - {slot.endTime}
                                                        </span>
                                                    </div>

                                                    <div>
                                                        <h4 className="font-bold text-slate-800 text-sm">
                                                            {subj ? subj.name : 'Lecture'}
                                                        </h4>
                                                        <p className="text-xs text-slate-500">
                                                            {subj?.code && <span className="font-mono">{subj.code} • </span>}
                                                            Room: <strong>{override?.room || slot.room || 'Room TBA'}</strong>
                                                        </p>
                                                    </div>

                                                    {isCancelled && (
                                                        <span className="inline-block text-[10px] font-bold bg-red-100 text-red-700 px-2 py-0.5 rounded-full">
                                                            Class Cancelled Today
                                                        </span>
                                                    )}
                                                </div>
                                            );
                                        })}
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    {/* View Selection: Detailed Attendance History Log */}
                    {activeTab === 'student_history' && (
                        <div className="bg-white rounded-2xl p-6 border border-slate-200 shadow-sm space-y-4">
                            <div className="flex flex-wrap justify-between items-center gap-3 border-b pb-4">
                                <div>
                                    <h2 className="text-base font-bold text-slate-800 flex items-center gap-2">
                                        <span>📜</span> Attendance Record History
                                    </h2>
                                    <p className="text-xs text-slate-500">
                                        Chronological history of every attendance marked for your roll number
                                    </p>
                                </div>

                                {/* Subject Filter */}
                                <div className="flex items-center gap-2 text-xs">
                                    <span className="text-slate-500 font-semibold">Filter Subject:</span>
                                    <select
                                        value={historySubjectFilter}
                                        onChange={e => setHistorySubjectFilter(e.target.value)}
                                        className="p-1.5 rounded-lg border border-slate-300 bg-white text-xs"
                                    >
                                        <option value="all">All Subjects</option>
                                        {classSubjects.map(s => (
                                            <option key={s.id} value={s.id}>{s.name}</option>
                                        ))}
                                    </select>
                                </div>
                            </div>

                            {filteredAttendanceHistory.length === 0 ? (
                                <div className="p-8 text-center text-slate-400 text-xs italic">
                                    No attendance records found matching criteria.
                                </div>
                            ) : (
                                <div className="overflow-x-auto">
                                    <table className="w-full text-xs text-left">
                                        <thead className="bg-slate-50 text-slate-600 uppercase font-semibold border-b">
                                            <tr>
                                                <th className="py-2.5 px-3">Date</th>
                                                <th className="py-2.5 px-3">Period</th>
                                                <th className="py-2.5 px-3">Subject</th>
                                                <th className="py-2.5 px-3 text-center">Status</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-100">
                                            {filteredAttendanceHistory.map(record => {
                                                const subj = db.subjects.find(s => s.id === record.subjectId);
                                                return (
                                                    <tr key={record.id} className="hover:bg-slate-50/80">
                                                        <td className="py-2 px-3 font-mono text-slate-700">{record.date}</td>
                                                        <td className="py-2 px-3 font-mono font-bold text-slate-600">Period {record.period}</td>
                                                        <td className="py-2 px-3 font-medium text-slate-800">{subj ? subj.name : 'Subject'}</td>
                                                        <td className="py-2 px-3 text-center">
                                                            <span className={`px-2.5 py-0.5 rounded-full text-[11px] font-bold ${
                                                                record.status === 'present' ? 'bg-emerald-100 text-emerald-800' :
                                                                record.status === 'absent' ? 'bg-red-100 text-red-800' :
                                                                'bg-amber-100 text-amber-800'
                                                            }`}>
                                                                {record.status.toUpperCase()}
                                                            </span>
                                                        </td>
                                                    </tr>
                                                );
                                            })}
                                        </tbody>
                                    </table>
                                </div>
                            )}
                        </div>
                    )}
                </div>
            );
        }
        // ---------------------------------------------------------
        function AttendanceView({ db, setDb, currentUser, supabaseClient, showToast, onRefresh }) {
            const todayStr = new Date().toISOString().split('T')[0];
            const [selectedDate, setSelectedDate] = useState(todayStr);
            const [selectedClass, setSelectedClass] = useState('');
            const [selectedPeriod, setSelectedPeriod] = useState('1');
            const [selectedSubject, setSelectedSubject] = useState('');
            const [attendanceState, setAttendanceState] = useState({});
            const [isLoaded, setIsLoaded] = useState(false);
            const [isSaving, setIsSaving] = useState(false);

            useEffect(() => {
                if (db.classes.length > 0 && !selectedClass) {
                    setSelectedClass(db.classes[0].id);
                }
            }, [db.classes]);

            const scheduledPeriods = useMemo(() => {
                if (!selectedDate || !selectedClass) return [];
                const jsDay = new Date(selectedDate + 'T12:00:00').getDay();
                const dayIndex = (jsDay + 6) % 7;

                const regular = db.timetable.filter(t => t.classId === selectedClass && Number(t.day) === dayIndex);
                const dailyOverrides = db.overrides.filter(ov => ov.classId === selectedClass && ov.date === selectedDate);

                const map = new Map();
                regular.forEach(r => {
                    const sub = db.subjects.find(s => s.id === r.subjectId);
                    map.set(Number(r.period), {
                        period: Number(r.period),
                        subjectId: r.subjectId,
                        subjectName: sub ? sub.name : 'Subject',
                        time: `${r.startTime} - ${r.endTime}`,
                        isCancelled: false,
                        room: r.room
                    });
                });

                dailyOverrides.forEach(ov => {
                    const p = Number(ov.period);
                    if (ov.isCancelled) {
                        map.set(p, {
                            period: p,
                            subjectId: '',
                            subjectName: '[CANCELLED]',
                            time: '',
                            isCancelled: true,
                            room: ''
                        });
                    } else {
                        const repSub = db.subjects.find(s => s.id === ov.replacementSubjectId);
                        map.set(p, {
                            period: p,
                            subjectId: ov.replacementSubjectId,
                            subjectName: (repSub ? repSub.name : 'Unknown') + ' (Replacement)',
                            time: `${ov.startTime} - ${ov.endTime}`,
                            isCancelled: false,
                            room: ov.room
                        });
                    }
                });

                return Array.from(map.values()).sort((a, b) => a.period - b.period);
            }, [selectedDate, selectedClass, db.timetable, db.overrides, db.subjects]);

            useEffect(() => {
                if (scheduledPeriods.length > 0) {
                    const currentScheduled = scheduledPeriods.find(p => String(p.period) === String(selectedPeriod));
                    if (currentScheduled && !currentScheduled.isCancelled && currentScheduled.subjectId) {
                        setSelectedSubject(currentScheduled.subjectId);
                    } else {
                        const firstValid = scheduledPeriods.find(p => !p.isCancelled);
                        if (firstValid) {
                            setSelectedPeriod(String(firstValid.period));
                            setSelectedSubject(firstValid.subjectId);
                        }
                    }
                } else {
                    const classSubjects = db.subjects.filter(s => s.classId === selectedClass);
                    if (classSubjects.length > 0) {
                        setSelectedSubject(classSubjects[0].id);
                    }
                }
            }, [scheduledPeriods, selectedPeriod, selectedClass]);

            const currentStudents = useMemo(() => {
                return db.students.filter(s => s.classId === selectedClass);
            }, [db.students, selectedClass]);

            const handleLoadAttendance = () => {
                if (!selectedClass) {
                    showToast('Please select a class first', 'error');
                    return;
                }
                const existing = {};
                db.attendance
                    .filter(a => a.date === selectedDate && a.classId === selectedClass && String(a.period) === String(selectedPeriod))
                    .forEach(a => { existing[a.studentId] = a.status; });

                const newState = {};
                currentStudents.forEach(st => {
                    newState[st.id] = existing[st.id] || 'present';
                });

                setAttendanceState(newState);
                setIsLoaded(true);
                showToast(`Loaded ${currentStudents.length} students for attendance`, 'success');
            };

            const markAll = (status) => {
                const updated = {};
                currentStudents.forEach(st => { updated[st.id] = status; });
                setAttendanceState(updated);
            };

            const setStudentStatus = (studentId, status) => {
                setAttendanceState(prev => ({ ...prev, [studentId]: status }));
            };

            const handleSaveAttendance = async () => {
                if (currentStudents.length === 0) {
                    showToast('No students loaded to save', 'error');
                    return;
                }
                if (!selectedSubject) {
                    showToast('Please select a subject for attendance', 'error');
                    return;
                }

                setIsSaving(true);
                try {
                    const recordsToUpsert = currentStudents.map(st => ({
                        teacher_id: currentUser.id,
                        student_id: st.id,
                        subject_id: selectedSubject,
                        attendance_date: selectedDate,
                        period_number: Number(selectedPeriod),
                        status: attendanceState[st.id] || 'present'
                    }));

                    if (supabaseClient) {
                        const { error: attError } = await supabaseClient
                            .from('attendance')
                            .upsert(recordsToUpsert, {
                                onConflict: 'student_id,subject_id,attendance_date,period_number'
                            });

                        if (attError) throw attError;

                        const { error: sessionError } = await supabaseClient
                            .from('attendance_sessions')
                            .upsert({
                                teacher_id: currentUser.id,
                                class_id: selectedClass,
                                subject_id: selectedSubject,
                                session_date: selectedDate,
                                period_number: Number(selectedPeriod),
                                status: 'held'
                            }, {
                                onConflict: 'class_id,subject_id,session_date,period_number'
                            });

                        if (sessionError) console.warn('Session recording notice:', sessionError.message);
                    }

                    showToast(`Successfully saved attendance for Period ${selectedPeriod}!`, 'success');
                    if (onRefresh) onRefresh();
                } catch (err) {
                    console.error('Error saving attendance:', err);
                    showToast('Failed to save attendance: ' + err.message, 'error');
                } finally {
                    setIsSaving(false);
                }
            };

            const counts = useMemo(() => {
                let p = 0, a = 0, l = 0;
                Object.values(attendanceState).forEach(st => {
                    if (st === 'present') p++;
                    else if (st === 'absent') a++;
                    else if (st === 'leave') l++;
                });
                const total = currentStudents.length;
                return {
                    p, a, l,
                    pPct: total ? ((p / total) * 100).toFixed(0) : 0,
                    aPct: total ? ((a / total) * 100).toFixed(0) : 0,
                    lPct: total ? ((l / total) * 100).toFixed(0) : 0
                };
            }, [attendanceState, currentStudents]);

            return (
                <div className="bg-white rounded-2xl p-6 border border-slate-200 shadow-sm space-y-5">
                    <div className="flex flex-wrap justify-between items-center gap-3 border-b border-slate-100 pb-4">
                        <div>
                            <h2 className="text-lg font-bold text-slate-800 flex items-center gap-2">
                                <span>📝</span> Mark Period-Wise Attendance
                            </h2>
                            <p className="text-xs text-slate-500">
                                Select date, class, and lecture period to mark student presence.
                            </p>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 bg-slate-50 p-4 rounded-xl border border-slate-200">
                        <div>
                            <label className="text-xs font-semibold text-slate-700 block mb-1">Date</label>
                            <input
                                type="date"
                                value={selectedDate}
                                onChange={e => { setSelectedDate(e.target.value); setIsLoaded(false); }}
                                className="w-full text-xs p-2.5 rounded-lg border border-slate-300 bg-white"
                            />
                        </div>

                        <div>
                            <label className="text-xs font-semibold text-slate-700 block mb-1">Class / Section</label>
                            <select
                                value={selectedClass}
                                onChange={e => { setSelectedClass(e.target.value); setIsLoaded(false); }}
                                className="w-full text-xs p-2.5 rounded-lg border border-slate-300 bg-white"
                            >
                                {db.classes.length === 0 ? (
                                    <option value="">No classes found. Add in Admin Setup.</option>
                                ) : (
                                    db.classes.map(c => (
                                        <option key={c.id} value={c.id}>{c.name}</option>
                                    ))
                                )}
                            </select>
                        </div>

                        <div>
                            <label className="text-xs font-semibold text-slate-700 block mb-1">Scheduled Period</label>
                            <select
                                value={selectedPeriod}
                                onChange={e => {
                                    setSelectedPeriod(e.target.value);
                                    const sched = scheduledPeriods.find(p => String(p.period) === e.target.value);
                                    if (sched && sched.subjectId) setSelectedSubject(sched.subjectId);
                                    setIsLoaded(false);
                                }}
                                className="w-full text-xs p-2.5 rounded-lg border border-slate-300 bg-white"
                            >
                                {scheduledPeriods.length === 0 ? (
                                    [1,2,3,4,5,6,7,8].map(p => (
                                        <option key={p} value={p}>Period {p}</option>
                                    ))
                                ) : (
                                    scheduledPeriods.map(p => (
                                        <option key={p.period} value={p.period} disabled={p.isCancelled}>
                                            Period {p.period}: {p.subjectName} {p.time ? `(${p.time})` : ''} {p.isCancelled ? '[CANCELLED]' : ''}
                                        </option>
                                    ))
                                )}
                            </select>
                        </div>

                        <div>
                            <label className="text-xs font-semibold text-slate-700 block mb-1">Subject</label>
                            <select
                                value={selectedSubject}
                                onChange={e => setSelectedSubject(e.target.value)}
                                className="w-full text-xs p-2.5 rounded-lg border border-slate-300 bg-white"
                            >
                                {db.subjects.filter(s => s.classId === selectedClass).map(s => (
                                    <option key={s.id} value={s.id}>{s.name} ({s.code || 'N/A'})</option>
                                ))}
                            </select>
                        </div>
                    </div>

                    <div className="flex flex-wrap items-center justify-between gap-3 pt-1">
                        <div className="flex items-center gap-2">
                            <button
                                onClick={handleLoadAttendance}
                                className="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-4 py-2 rounded-xl text-xs shadow-sm transition"
                            >
                                👥 Load Students ({currentStudents.length})
                            </button>
                            {isLoaded && (
                                <>
                                    <button
                                        onClick={() => markAll('present')}
                                        className="bg-emerald-50 hover:bg-emerald-100 text-emerald-700 border border-emerald-300 font-medium px-3 py-2 rounded-xl text-xs transition"
                                    >
                                        ✓ All Present
                                    </button>
                                    <button
                                        onClick={() => markAll('absent')}
                                        className="bg-red-50 hover:bg-red-100 text-red-700 border border-red-300 font-medium px-3 py-2 rounded-xl text-xs transition"
                                    >
                                        ✗ All Absent
                                    </button>
                                </>
                            )}
                        </div>

                        {isLoaded && (
                            <div className="flex items-center gap-2 text-xs font-semibold">
                                <span className="bg-emerald-100 text-emerald-800 px-2.5 py-1 rounded-lg">
                                    Present: {counts.p} ({counts.pPct}%)
                                </span>
                                <span className="bg-red-100 text-red-800 px-2.5 py-1 rounded-lg">
                                    Absent: {counts.a} ({counts.aPct}%)
                                </span>
                                <span className="bg-amber-100 text-amber-800 px-2.5 py-1 rounded-lg">
                                    Leave: {counts.l} ({counts.lPct}%)
                                </span>
                            </div>
                        )}
                    </div>

                    <div className="border border-slate-200 rounded-xl overflow-hidden shadow-sm">
                        <table className="w-full text-left text-xs border-collapse">
                            <thead>
                                <tr className="bg-slate-50 text-slate-500 border-b border-slate-200">
                                    <th className="p-3 w-20">Roll No</th>
                                    <th className="p-3">Student Name</th>
                                    <th className="p-3 text-right">Attendance Status</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-slate-100">
                                {!isLoaded ? (
                                    <tr>
                                        <td colSpan="3" className="p-8 text-center text-slate-400 italic">
                                            Choose date, class, and period, then click <strong className="text-slate-600">"Load Students"</strong>.
                                        </td>
                                    </tr>
                                ) : currentStudents.length === 0 ? (
                                    <tr>
                                        <td colSpan="3" className="p-8 text-center text-slate-400 italic">
                                            No students found in this class in your Supabase database. Add students in Admin Setup.
                                        </td>
                                    </tr>
                                ) : (
                                    currentStudents.map(student => {
                                        const currentStatus = attendanceState[student.id] || 'present';
                                        return (
                                            <tr key={student.id} className="hover:bg-slate-50/80 transition">
                                                <td className="p-3 font-mono font-bold text-slate-700">{student.rollNo}</td>
                                                <td className="p-3 font-semibold text-slate-800">{student.name}</td>
                                                <td className="p-3 text-right">
                                                    <div className="inline-flex rounded-lg bg-slate-100 p-1 border border-slate-200 gap-1">
                                                        <button
                                                            type="button"
                                                            onClick={() => setStudentStatus(student.id, 'present')}
                                                            className={`px-3 py-1 rounded-md font-semibold text-xs transition ${
                                                                currentStatus === 'present'
                                                                    ? 'bg-emerald-600 text-white shadow-sm'
                                                                    : 'text-slate-600 hover:text-slate-900'
                                                            }`}
                                                        >
                                                            Present
                                                        </button>
                                                        <button
                                                            type="button"
                                                            onClick={() => setStudentStatus(student.id, 'absent')}
                                                            className={`px-3 py-1 rounded-md font-semibold text-xs transition ${
                                                                currentStatus === 'absent'
                                                                    ? 'bg-red-600 text-white shadow-sm'
                                                                    : 'text-slate-600 hover:text-slate-900'
                                                            }`}
                                                        >
                                                            Absent
                                                        </button>
                                                        <button
                                                            type="button"
                                                            onClick={() => setStudentStatus(student.id, 'leave')}
                                                            className={`px-3 py-1 rounded-md font-semibold text-xs transition ${
                                                                currentStatus === 'leave'
                                                                    ? 'bg-amber-500 text-white shadow-sm'
                                                                    : 'text-slate-600 hover:text-slate-900'
                                                            }`}
                                                        >
                                                            Leave
                                                        </button>
                                                    </div>
                                                </td>
                                            </tr>
                                        );
                                    })
                                )}
                            </tbody>
                        </table>
                    </div>

                    {isLoaded && (
                        <div className="pt-2 flex justify-end">
                            <button
                                onClick={handleSaveAttendance}
                                disabled={isSaving}
                                className="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-6 py-2.5 rounded-xl text-xs shadow-md transition flex items-center gap-2"
                            >
                                {isSaving ? (
                                    <>
                                        <span className="w-3 h-3 rounded-full border-2 border-white border-t-transparent animate-spin"></span>
                                        Saving to Supabase...
                                    </>
                                ) : (
                                    <>💾 Save to Supabase</>
                                )}
                            </button>
                        </div>
                    )}
                </div>
            );
        }

        // ---------------------------------------------------------
        // 3. WEEKLY TIMETABLE & GRID VIEW
        // ---------------------------------------------------------
        function TimetableView({ db, setDb, currentUser, supabaseClient, showToast, onRefresh }) {
            const [selectedClass, setSelectedClass] = useState(db.classes[0]?.id || '');
            const [day, setDay] = useState('0');
            const [period, setPeriod] = useState('1');
            const [subjectId, setSubjectId] = useState('');
            const [startTime, setStartTime] = useState('09:00');
            const [endTime, setEndTime] = useState('10:00');
            const [room, setRoom] = useState('LH-101');

            const classSubjects = useMemo(() => {
                return db.subjects.filter(s => s.classId === selectedClass);
            }, [db.subjects, selectedClass]);

            useEffect(() => {
                if (classSubjects.length > 0 && !subjectId) {
                    setSubjectId(classSubjects[0].id);
                }
            }, [classSubjects]);

            const handleAddTimetable = async (e) => {
                e.preventDefault();
                if (!subjectId || !selectedClass) {
                    showToast('Please select a class and subject', 'error');
                    return;
                }

                try {
                    if (supabaseClient) {
                        const { error } = await supabaseClient
                            .from('timetable')
                            .upsert({
                                admin_id: currentUser.id,
                                teacher_id: currentUser.id,
                                class_id: selectedClass,
                                subject_id: subjectId,
                                day_of_week: Number(day),
                                period_number: Number(period),
                                start_time: startTime,
                                end_time: endTime,
                                room: room || null
                            }, {
                                onConflict: 'class_id,day_of_week,period_number'
                            });

                        if (error) throw error;
                    }

                    showToast(`Saved timetable period for ${DAYS[day]} Period ${period}`, 'success');
                    if (onRefresh) onRefresh();
                } catch (err) {
                    showToast('Failed to save timetable: ' + err.message, 'error');
                }
            };

            const handleDeleteSlot = async (id) => {
                try {
                    if (supabaseClient) {
                        const { error } = await supabaseClient.from('timetable').delete().eq('id', id);
                        if (error) throw error;
                    }
                    showToast('Timetable period removed', 'info');
                    if (onRefresh) onRefresh();
                } catch (err) {
                    showToast('Delete error: ' + err.message, 'error');
                }
            };

            const timetableForClass = db.timetable.filter(t => t.classId === selectedClass);

            return (
                <div className="space-y-6">
                    <div className="bg-white rounded-2xl p-6 border border-slate-200 shadow-sm flex flex-wrap justify-between items-center gap-4">

                            <h2 className="text-lg font-bold text-slate-800 flex items-center gap-2">
                                <span>📅</span> Weekly Timetable Master
                            </h2>
                            <p className="text-xs text-slate-500">
                                Live weekly schedule stored in your Supabase database.
                            </p>
                        </div>
                        <div className="flex items-center gap-2">
                            <label className="text-xs font-semibold text-slate-600">Select Class:</label>
                            <select
                                value={selectedClass}
                                onChange={e => { setSelectedClass(e.target.value); setSubjectId(''); }}
                                className="text-xs p-2 rounded-lg border border-slate-300 bg-white font-medium"
                            >
                                {db.classes.map(c => (
                                    <option key={c.id} value={c.id}>{c.name}</option>
                                ))}
                            </select>
                        </div>
                    </div>

                    <div className="bg-white rounded-2xl p-6 border border-slate-200 shadow-sm">
                        <h3 className="text-sm font-bold text-slate-800 mb-3">Schedule Matrix</h3>
                        <div className="overflow-x-auto border border-slate-200 rounded-xl">
                            <table className="w-full text-center text-xs border-collapse min-w-[700px]">
                                <thead>
                                    <tr className="bg-slate-100 text-slate-600 border-b border-slate-200">
                                        <th className="p-3 w-28 text-left">Day / Period</th>
                                        {[1, 2, 3, 4, 5, 6, 7, 8].map(p => (
                                            <th key={p} className="p-2.5 font-bold">P{p}</th>
                                        ))}
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-200">
                                    {[0, 1, 2, 3, 4, 5].map(dIndex => (
                                        <tr key={dIndex} className="hover:bg-slate-50/60">
                                            <td className="p-3 font-bold text-slate-700 bg-slate-50 text-left border-r border-slate-200">
                                                {DAYS[dIndex]}
                                            </td>
                                            {[1, 2, 3, 4, 5, 6, 7, 8].map(pNum => {
                                                const slot = timetableForClass.find(
                                                    t => Number(t.day) === dIndex && Number(t.period) === pNum
                                                );
                                                const sub = slot ? db.subjects.find(s => s.id === slot.subjectId) : null;

                                                return (
                                                    <td key={pNum} className="p-2 border-r border-slate-100 align-top h-16">
                                                        {slot ? (
                                                            <div className="bg-blue-50 border border-blue-200 p-1.5 rounded-lg text-left h-full flex flex-col justify-between shadow-2xs">
                                                                <div>
                                                                    <p className="font-bold text-[11px] text-blue-900 leading-tight">
                                                                        {sub ? sub.name : 'Unknown'}
                                                                    </p>
                                                                    <p className="text-[10px] text-blue-600 truncate">{slot.startTime}-{slot.endTime}</p>
                                                                </div>
                                                                <div className="flex justify-between items-center text-[9px] text-slate-400 mt-1">
                                                                    <span>{slot.room || '-'}</span>
                                                                    <button
                                                                        onClick={() => handleDeleteSlot(slot.id)}

                                                                        ×

                                                                </div>
                                                            </div>

                                                            <div className="h-full border border-dashed border-slate-200 rounded-lg flex items-center justify-center text-slate-300 hover:bg-slate-50">
                                                                —
                                                            </div>
                                                        )}
                                                    </td>
                                                );
                                            })}
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <div className="bg-white rounded-2xl p-6 border border-slate-200 shadow-sm">
                        <h3 className="text-sm font-bold text-slate-800 mb-3">Add or Update Timetable Period</h3>
                        <form onSubmit={handleAddTimetable} className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                            <div>
                                <label className="text-xs font-semibold text-slate-700 block mb-1">Weekday</label>
                                <select
                                    value={day}
                                    onChange={e => setDay(e.target.value)}
                                    className="w-full text-xs p-2.5 rounded-lg border border-slate-300 bg-white"
                                >
                                    {DAYS.slice(0, 6).map((d, i) => (
                                        <option key={i} value={i}>{d}</option>
                                    ))}
                                </select>
                            </div>

                            <div>
                                <label className="text-xs font-semibold text-slate-700 block mb-1">Period Number</label>
                                <select
                                    value={period}
                                    onChange={e => setPeriod(e.target.value)}
                                    className="w-full text-xs p-2.5 rounded-lg border border-slate-300 bg-white"
                                >
                                    {[1, 2, 3, 4, 5, 6, 7, 8].map(p => (
                                        <option key={p} value={p}>Period {p}</option>
                                    ))}
                                </select>
                            </div>

                            <div>
                                <label className="text-xs font-semibold text-slate-700 block mb-1">Subject</label>
                                <select
                                    value={subjectId}
                                    onChange={e => setSubjectId(e.target.value)}
                                    className="w-full text-xs p-2.5 rounded-lg border border-slate-300 bg-white"
                                    required
                                >
                                    {classSubjects.map(s => (
                                        <option key={s.id} value={s.id}>{s.name} ({s.code || 'N/A'})</option>
                                    ))}
                                </select>
                            </div>

                            <div>
                                <label className="text-xs font-semibold text-slate-700 block mb-1">Room / Lab</label>
                                <input
                                    type="text"
                                    value={room}
                                    onChange={e => setRoom(e.target.value)}
                                    placeholder="e.g. LH-201"
                                    className="w-full text-xs p-2.5 rounded-lg border border-slate-300 bg-white"
                                />
                            </div>

                            <div>
                                <label className="text-xs font-semibold text-slate-700 block mb-1">Start Time</label>
                                <input
                                    type="time"
                                    value={startTime}
                                    onChange={e => setStartTime(e.target.value)}
                                    className="w-full text-xs p-2.5 rounded-lg border border-slate-300 bg-white"
                                    required
                                />

                                <label className="text-xs font-semibold text-slate-700 block mb-1">End Time</label>

                    </div>
                </div>
            );

                                    required
                                />
                            </div>

                            <div>
                                <label className="text-xs font-semibold text-slate-700 block mb-1">Class</label>
                                <select
                                    value={classId}
                                    onChange={e => { setClassId(e.target.value); setReplacementSubjectId(''); }}
                                    className="w-full text-xs p-2.5 rounded-lg border border-slate-300 bg-white"

                                    value={period}
                                    onChange={e => setPeriod(e.target.value)}
                                    className="w-full text-xs p-2.5 rounded-lg border border-slate-300 bg-white"

                                    {[1, 2, 3, 4, 5, 6, 7, 8].map(p => (
                                        <option key={p} value={p}>Period {p}</option>

                                        <option key={s.id} value={s.id}>{s.name}</option>

                                    className="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg text-xs shadow-sm transition"

                return db.subjects.filter(s => s.classId === classId);
            }, [db.subjects, classId]);

            const generateReport = () => {
                const students = db.students.filter(s => s.classId === classId);
                if (students.length === 0) {
                    showToast('No students enrolled in this class', 'error');
                    setReportData([]);
                    return;
                }

                const rows = students.map(st => {
                    const studentRecords = db.attendance.filter(
                        a => a.studentId === st.id && a.classId === classId && (!subjectId || a.subjectId === subjectId)
                    );
                    const present = studentRecords.filter(r => r.status === 'present').length;
                    const absent = studentRecords.filter(r => r.status === 'absent').length;
                    const leave = studentRecords.filter(r => r.status === 'leave').length;
                    const total = present + absent + leave;
                    const percent = total > 0 ? ((present / total) * 100).toFixed(1) : '0.0';

                    return {
                        id: st.id,
                        rollNo: st.rollNo,
                        name: st.name,
                        present,
                        absent,
                        leave,
                        total,
                        percent: Number(percent)
                    };
                });

                setReportData(rows);
                showToast(`Report generated for ${rows.length} students`, 'success');

            const exportCSV = () => {
                if (reportData.length === 0) {
                    showToast('Please generate report first', 'error');
                    return;
                }
                const cl = db.classes.find(c => c.id === classId);
                const sub = db.subjects.find(s => s.id === subjectId);
                let csv = `Class: ${cl?.name || ''}, Subject: ${sub?.name || 'All Subjects'}\n`;
                csv += 'Roll No,Student Name,Present,Absent,Leave,Total Periods,Attendance Percentage\n';

                reportData.forEach(r => {
                    csv += `"${r.rollNo}","${r.name}",${r.present},${r.absent},${r.leave},${r.total},"${r.percent}%"\n`;
                });

                const blob = new Blob(["\uFEFF" + csv], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = `Attendance_Report_${cl?.name}_${new Date().toISOString().split('T')[0]}.csv`;
                link.click();
            };

            const exportExcel = () => {
                if (reportData.length === 0) {
                    showToast('Please generate report first', 'error');
                    return;
                }
                const cl = db.classes.find(c => c.id === classId);
                const sub = db.subjects.find(s => s.id === subjectId);

                const distinctDates = [...new Set(
                    db.attendance
                        .filter(a => a.classId === classId && (!subjectId || a.subjectId === subjectId))
                        .map(a => a.date)
                )].sort();

                const rows = reportData.map(r => {
                    const rowObj = {
                        'Roll No': r.rollNo,
                        'Student Name': r.name
                    };

                    distinctDates.forEach(dt => {
                        const recs = db.attendance.filter(
                            a => a.studentId === r.id && a.date === dt && (!subjectId || a.subjectId === subjectId)
                        );
                        rowObj[dt] = recs.map(rc => rc.status === 'present' ? 'P' : rc.status === 'absent' ? 'A' : 'L').join(', ') || '-';
                    });

                    rowObj['Present'] = r.present;
                    rowObj['Absent'] = r.absent;
                    rowObj['Leave'] = r.leave;
                    rowObj['Total Held'] = r.total;
                    rowObj['Attendance %'] = `${r.percent}%`;

                    return rowObj;
                });

                const ws = XLSX.utils.json_to_sheet(rows);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, 'Attendance Report');
                XLSX.writeFile(wb, `Attendance_${cl?.name}_${sub?.name || 'All'}.xlsx`);
                showToast('Downloaded Subject Attendance Excel Workbook', 'success');
            };

                <div className="bg-white rounded-2xl p-6 border border-slate-200 shadow-sm space-y-5">

                                View aggregate attendance statistics and export records.
                            </p>

                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 bg-slate-50 p-4 rounded-xl border border-slate-200">

                            <label className="text-xs font-semibold text-slate-700 block mb-1">Class</label>
                            <select
                                value={classId}
                                onChange={e => { setClassId(e.target.value); setSubjectId(''); }}
                                className="w-full text-xs p-2.5 rounded-lg border border-slate-300 bg-white"
                            >
                                {db.classes.map(c => (
                                    <option key={c.id} value={c.id}>{c.name}</option>
                                ))}
                            </select>
                        </div>

                        <div>
                            <label className="text-xs font-semibold text-slate-700 block mb-1">Subject</label>
                            <select
                                value={subjectId}
                                onChange={e => setSubjectId(e.target.value)}
                                className="w-full text-xs p-2.5 rounded-lg border border-slate-300 bg-white"
                            >
                                <option value="">All Subjects (Combined)</option>
                                {classSubjects.map(s => (
                                    <option key={s.id} value={s.id}>{s.name} ({s.code || 'N/A'})</option>

                        <div className="flex items-end">

                            >
                                🔍 Generate Report
                            </button>
                        </div>
                    </div>

                    {reportData.length > 0 && (
                        <div className="flex flex-wrap justify-between items-center gap-3 pt-2">
                            <span className="text-xs text-slate-500">

        function DefaultersView({ db, showToast }) {

                const students = db.students.filter(s => !selectedClass || s.classId === selectedClass);
                const list = [];

                students.forEach(st => {
                    const records = db.attendance.filter(a => a.studentId === st.id);
                    if (records.length > 0) {
                        const present = records.filter(r => r.status === 'present').length;
                        const total = records.length;

                        if (pct < 75) {
                            const cl = db.classes.find(c => c.id === st.classId);
                            list.push({

                                className: cl ? cl.name : 'N/A',
                                present,
                                absent: total - present,
                                total,
                                percent: pct
                            });
                        }

            const [newClassName, setNewClassName] = useState('');

            const [subjectClassId, setSubjectClassId] = useState(db.classes[0]?.id || '');
            const [subjectName, setSubjectName] = useState('');
            const [subjectCode, setSubjectCode] = useState('');

            // Supabase Credentials Settings (Admin-Only)
            const [adminUrl, setAdminUrl] = useState(supabaseUrl || '');
            const [adminKey, setAdminKey] = useState(supabaseKey || '');
            const [credsTesting, setCredsTesting] = useState(false);
            const [credsResult, setCredsResult] = useState(null);

            // Auto-select first class across subtabs once db.classes loads
            useEffect(() => {
                if (db.classes.length > 0) {
                    if (!studentClassId || !db.classes.some(c => c.id === studentClassId)) {
                        setStudentClassId(db.classes[0].id);
                    }
                    if (!importClassId || !db.classes.some(c => c.id === importClassId)) {
                        setImportClassId(db.classes[0].id);
                    }
                    if (!assignClassId || !db.classes.some(c => c.id === assignClassId)) {
                        setAssignClassId(db.classes[0].id);
                    }
                    if (!subjectClassId || !db.classes.some(c => c.id === subjectClassId)) {
                        setSubjectClassId(db.classes[0].id);
                    }
                }
            }, [db.classes]);

            // Subjects for currently selected assignment class
            const availableAssignmentSubjects = useMemo(() => {
                const targetCls = assignClassId || db.classes[0]?.id;
                if (!targetCls) return [];
                return db.subjects.filter(s => s.classId === targetCls);
            }, [assignClassId, db.classes, db.subjects]);

            useEffect(() => {
                if (availableAssignmentSubjects.length > 0) {
                    setAssignSubjectId(availableAssignmentSubjects[0].id);
                } else {
                    setAssignSubjectId('');
                }
            }, [availableAssignmentSubjects]);
